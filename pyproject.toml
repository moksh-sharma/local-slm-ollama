[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-slm-ollama"
version = "0.1.0"
description = "Offline local SLM app with Ollama — benchmark latency, throughput, and quality tradeoffs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.3"]

[project.scripts]
slm-chat = "local_slm.cli:chat_main"
slm-benchmark = "local_slm.cli:benchmark_main"
slm-compare = "local_slm.cli:compare_main"
slm-report = "local_slm.cli:report_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
