<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local SLM · Ollama</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>

<body>
  <header class="header">
    <div class="brand">
      <span class="logo">◉</span>
      <div>
        <h1>Local SLM</h1>
        <p class="subtitle" id="status-line">Connecting…</p>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="chat" role="tab">Chat</button>
      <button class="tab" data-tab="compare" role="tab">Compare</button>
      <button class="tab" data-tab="report" role="tab">Report</button>
    </nav>
  </header>

  <main>
    <section id="panel-chat" class="panel active">
      <div class="toolbar">
        <label>
          Model
          <select id="chat-model"></select>
        </label>
        <label class="checkbox">
          <input type="checkbox" id="stream-toggle" checked />
          Stream tokens
        </label>
      </div>
      <div id="chat-messages" class="messages" aria-live="polite"></div>
      <form id="chat-form" class="composer">
        <textarea id="chat-input" rows="2" placeholder="Ask something — runs entirely on your machine…"
          required></textarea>
        <button type="submit" id="chat-send">Send</button>
      </form>
    </section>

    <section id="panel-compare" class="panel">
      <div class="card">
        <h2>Three-model comparison</h2>
        <p class="hint">
          Benchmarks speed (TTFT, latency, tok/s) and deterministic quality tasks on the
          models below. This can take several minutes per model.
        </p>
        <label class="full">
          Models (comma-separated)
          <input type="text" id="compare-models" />
        </label>
        <button type="button" id="compare-run" class="primary">Run comparison</button>
        <p id="compare-status" class="status-msg"></p>
      </div>
      <div id="compare-results" class="table-wrap hidden"></div>
    </section>

    <section id="panel-report" class="panel">
      <div class="toolbar">
        <button type="button" id="report-refresh" class="secondary">Load latest report</button>
        <a id="report-md-link" href="/api/report/latest.md" target="_blank" rel="noopener">Open markdown</a>
      </div>
      <div id="report-content" class="report-preview">
        <p class="hint">Run a comparison or load the last saved report.</p>
      </div>
    </section>
  </main>

  <script src="/static/app.js" type="module"></script>
</body>

</html>
